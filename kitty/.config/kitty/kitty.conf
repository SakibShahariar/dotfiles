# 🐱✨ Kitty Terminal Configuration

# ======================
# 🌈 Theme & Appearance
# ======================
include colors.conf
background_opacity        0.95
hide_window_decorations   no
window_fade_in_duration   0
enable_animation          yes

# ======================
# 🔤 Font Settings
# ======================
font_family               JetBrainsMono Nerd Font Mono
bold_font                 auto
italic_font               auto
bold_italic_font          auto
font_size                 12.0
map ctrl+shift+backspace  change_font_size all 0

# ======================
# 🖼 Window Layout
# ======================
remember_window_size      no
window_border_width       2pt
window_padding_width      5
window_margin_width       10
enabled_layouts           tall

# ======================
# 🖱 Mouse & Scrolling
# ======================
scrollback_lines          10000
wheel_scroll_multiplier   2.0
mouse_hide_wait           0.5
cursor_shape              beam
cursor_blink_interval     1
cursor_stop_blinking_after 3
cursor_trail              1
cursor_follows_text       yes

# ======================
# ✂ Clipboard
# ======================
copy_on_select            yes
map ctrl+v                paste_from_clipboard
allow_remote_control      yes
clipboard_control         write-clipboard write-primary

# ======================
# 📑 Tab Bar
# ======================
tab_bar_edge              top
tab_bar_margin_width      20
tab_bar_style             fade
tab_fade                  0
tab_bar_align             center

# Tab Title Templates
tab_title_template        "{fmt.bg.default}{fmt.fg._262828}{fmt.fg.default}{fmt.bg._262828}{fmt.fg.color7} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg._262828}{fmt.fg.default}"
active_tab_title_template "{fmt.bg.default}{fmt.fg.color7}{fmt.fg.default}{fmt.bg.color7}{fmt.fg._192425} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg.color7}{fmt.fg.default}"
active_tab_font_style     bold
inactive_tab_font_style   italic

# ======================
# ⚙️ Behavior
# ======================
allow_graphics            yes
enable_audio_bell         no
linux_display_server      x11
confirm_os_window_close   0
shell_integration         no-cursor

# ======================
# ⌨️ Key Bindings
# ======================

# Window Management
map alt+n                 new_window
map ctrl+w                close_window
map ctrl+shift+]          next_window
map ctrl+shift+[          previous_window

# Layout Management
map ctrl+shift+l          next_layout
map ctrl+alt+r            goto_layout tall
map ctrl+alt+s            goto_layout stack

# Tab Management
map ctrl+t                new_tab
map ctrl+alt+q            close_tab

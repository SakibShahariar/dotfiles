command_timeout = 10000

format = """
$username\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$python\
$nodejs\
$rust\
$golang\
$package\
$character
"""

# ─────────────────────────────
# CMD DURATION
# ─────────────────────────────
[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "#919091"

# ─────────────────────────────
# DIRECTORY
# ─────────────────────────────
[directory]
format = "[$path]($style) "
style = "bold #bec7d5"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = "󰎈 "
".config" = " "

# ─────────────────────────────
# GIT BRANCH
# ─────────────────────────────
[git_branch]
symbol = " "
style = "bold #bac8db"
format = "[$symbol$branch]($style) "

# ─────────────────────────────
# GIT STATUS
# ─────────────────────────────
[git_status]
use_git_executable = true
ignore_submodules = false
format = "([$all_status$ahead_behind]($style)) "
style = "bold #e4e2e3"

ahead = "[⇡${count}](bold #bec7d5) "
modified = "[!${count}](bold #bac8db) "
untracked = "[?${count}](bold #c2c7cf) "
renamed = "[»${count}](bold #dfe3eb) "
deleted = "[✘${count}](bold #ffb4ab) "

# ─────────────────────────────
# LANGUAGES
# ─────────────────────────────
[python]
symbol = "🐍 "
style = "bold #bac8db"

[nodejs]
symbol = " "
style = "bold #c2c7cf"

[rust]
symbol = "🦀 "
style = "bold #ffb4ab"

[golang]
symbol = " "
style = "bold #bec7d5"

# ─────────────────────────────
# PACKAGE
# ─────────────────────────────
[package]
symbol = "📦 "
style = "bold #c2c7cf"

# ─────────────────────────────
# USERNAME
# ─────────────────────────────
[username]
format = "[$user]($style) "
style_user = "bold #bec7d5"
show_always = true

# ─────────────────────────────
# CHARACTER
# ─────────────────────────────
[character]
success_symbol = "[❯](bold #bec7d5)"
error_symbol = "[✗](bold #ffb4ab)"
vimcmd_symbol = "[](bold #bac8db)"

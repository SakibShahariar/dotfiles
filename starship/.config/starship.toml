command_timeout = 10000

format = """
$username\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$python\
$nodejs\
$rust\
$golang\
$package\
$character
"""

# ─────────────────────────────
# CMD DURATION
# ─────────────────────────────
[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "#8b919d"

# ─────────────────────────────
# DIRECTORY
# ─────────────────────────────
[directory]
format = "[$path]($style) "
style = "bold #a3c9ff"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = "󰎈 "
".config" = " "

# ─────────────────────────────
# GIT BRANCH
# ─────────────────────────────
[git_branch]
symbol = " "
style = "bold #ffb688"
format = "[$symbol$branch]($style) "

# ─────────────────────────────
# GIT STATUS
# ─────────────────────────────
[git_status]
use_git_executable = true
ignore_submodules = false
format = "([$all_status$ahead_behind]($style)) "
style = "bold #e0e2ea"

ahead = "[⇡${count}](bold #a3c9ff) "
modified = "[!${count}](bold #ffb688) "
untracked = "[?${count}](bold #aec8f0) "
renamed = "[»${count}](bold #d3e3ff) "
deleted = "[✘${count}](bold #ffb4ab) "

# ─────────────────────────────
# LANGUAGES
# ─────────────────────────────
[python]
symbol = "🐍 "
style = "bold #ffb688"

[nodejs]
symbol = " "
style = "bold #aec8f0"

[rust]
symbol = "🦀 "
style = "bold #ffb4ab"

[golang]
symbol = " "
style = "bold #a3c9ff"

# ─────────────────────────────
# PACKAGE
# ─────────────────────────────
[package]
symbol = "📦 "
style = "bold #aec8f0"

# ─────────────────────────────
# USERNAME
# ─────────────────────────────
[username]
format = "[$user]($style) "
style_user = "bold #a3c9ff"
show_always = true

# ─────────────────────────────
# CHARACTER
# ─────────────────────────────
[character]
success_symbol = "[❯](bold #a3c9ff)"
error_symbol = "[✗](bold #ffb4ab)"
vimcmd_symbol = "[](bold #ffb688)"

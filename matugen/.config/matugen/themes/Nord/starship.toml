command_timeout = 10000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$python\
$nodejs\
$rust\
$golang\
$package\
$character
"""

[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "bold #A89984"

[directory]
style = "bold #E8E8E8"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = "󰎈 "
".config" = " "

[git_branch]
symbol = " "
style = "bold #7DAEA3"

[git_status]
use_git_executable = true
ignore_submodules = false
format = "$ahead$modified$untracked$renamed$deleted"
style = "bold #FB4934"  # error
ahead = "⇡:${count} "
renamed = "»:${count} "
deleted = "✘:${count} "
modified = "!:${count} "
untracked = "?:${count} "

[git_metrics]
disabled = true

[python]
symbol = '🐍'
style = "bold #F4B7BA"

[nodejs]
symbol = ""
style = "bold #D2C1D8"

[rust]
symbol = "🦀"
style = "bold #FB4934"

[golang]
symbol = ""
style = "bold #7DAEA3"

[package]
symbol = "📦"
style = "bold #E8E8E8"

[username]
format = "[$user]($style) "
style_user = "bold #7DAEA3"
show_always = true

[hostname]
format = "[@$hostname]($style)"
style = "bold #928374"
ssh_only = true

[time]
disabled = false
format = "🕒 %H:%M"
style = "bold #C6C6C6"

[character]
success_symbol = "[❯](bold #E2B6FF)"
error_symbol = "[✗](bold #FB4934)"
vimcmd_symbol = "[](bold #F4B7BA)"

